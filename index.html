<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Pocket">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#F2F2F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<title>Pocket Money</title>
<style>
:root{
  /* iOS system palette · inset-grouped lists · SF font stack · layout: tab-bar app, one scroll view per tab, sheets for tasks */
  --bg:#F2F2F7; --card:#FFFFFF; --bg-s:#F2F2F7; --card-s:#FFFFFF; --thumb:#FFFFFF;
  --fill:rgba(120,120,128,.12); --fill2:rgba(120,120,128,.20);
  --label:#000000; --label2:rgba(60,60,67,.6); --label3:rgba(60,60,67,.3); --sep:rgba(60,60,67,.29);
  --tint:#007AFF; --pos:#248A3D; --red:#FF3B30; --orange:#FF9500; --bubble:#E9E9EB;
  --bar:rgba(249,249,249,.84);
  --glass:rgba(255,255,255,.58); --glass-brd:rgba(255,255,255,.75); --glass-hi:rgba(255,255,255,.95); --glass-sh:0 10px 34px rgba(0,0,0,.13),0 2px 6px rgba(0,0,0,.05);
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Helvetica Neue",system-ui,sans-serif;
  --round:ui-rounded,"SF Pro Rounded",-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
  --ease:cubic-bezier(.32,.72,0,1);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#000000; --card:#1C1C1E; --bg-s:#1C1C1E; --card-s:#2C2C2E; --thumb:#636366;
    --fill:rgba(118,118,128,.24); --fill2:rgba(118,118,128,.36);
    --label:#FFFFFF; --label2:rgba(235,235,245,.6); --label3:rgba(235,235,245,.3); --sep:rgba(84,84,88,.65);
    --tint:#0A84FF; --pos:#30D158; --red:#FF453A; --orange:#FF9F0A; --bar:rgba(22,22,24,.84); --bubble:#26252A;
    --glass:rgba(44,44,48,.55); --glass-brd:rgba(255,255,255,.14); --glass-hi:rgba(255,255,255,.22); --glass-sh:0 10px 34px rgba(0,0,0,.5),0 2px 6px rgba(0,0,0,.3);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#000000; --card:#1C1C1E; --bg-s:#1C1C1E; --card-s:#2C2C2E; --thumb:#636366;
  --fill:rgba(118,118,128,.24); --fill2:rgba(118,118,128,.36);
  --label:#FFFFFF; --label2:rgba(235,235,245,.6); --label3:rgba(235,235,245,.3); --sep:rgba(84,84,88,.65);
  --tint:#0A84FF; --pos:#30D158; --red:#FF453A; --orange:#FF9F0A; --bar:rgba(22,22,24,.84); --bubble:#26252A;
  --glass:rgba(44,44,48,.55); --glass-brd:rgba(255,255,255,.14); --glass-hi:rgba(255,255,255,.22); --glass-sh:0 10px 34px rgba(0,0,0,.5),0 2px 6px rgba(0,0,0,.3);
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:var(--bg)}
@media all and (display-mode: standalone){html,body{height:100vh}}
body{color:var(--label);font-family:var(--font);font-size:17px;line-height:22px;letter-spacing:-.41px;-webkit-font-smoothing:antialiased;overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-text-size-adjust:100%}
input,textarea{-webkit-user-select:text;user-select:text}
button{font-family:inherit;color:inherit}
:focus-visible{outline:2px solid var(--tint);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}

#app{position:fixed;top:0;left:0;right:0;bottom:0;background:var(--bg);overflow:hidden;transform-origin:50% 0;transition:transform .5s var(--ease),border-radius .5s var(--ease),filter .5s}
#app.behind{transform:translateY(calc(env(safe-area-inset-top) + 8px)) scale(.92);border-radius:12px;filter:brightness(.85)}
.view{position:absolute;inset:0;display:none}
.view.on{display:block}
.view.on>.scroll{animation:fadein .2s ease}
@keyframes fadein{from{opacity:0}to{opacity:1}}
.scroll{position:absolute;inset:0;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior-y:contain;padding:calc(env(safe-area-inset-top) + 44px) 0 calc(env(safe-area-inset-bottom) + 84px)}
.page{position:absolute;inset:0;background:var(--bg);z-index:5}
.page.push{animation:push .45s var(--ease)}
@keyframes push{from{transform:translateX(100%);box-shadow:-10px 0 30px rgba(0,0,0,.15)}to{transform:none}}

/* navigation bar */
.nav{position:absolute;top:0;left:0;right:0;z-index:5;padding-top:env(safe-area-inset-top);transition:background-color .2s,box-shadow .2s}
.nav.scrolled,.nav.solid{background:var(--bar);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);box-shadow:0 .5px 0 var(--sep)}
.nav-in{height:44px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:0 8px}
.nav-t{font-weight:600;font-size:17px;opacity:0;transition:opacity .18s;white-space:nowrap;max-width:56vw;overflow:hidden;text-overflow:ellipsis}
.nav.scrolled .nav-t,.nav.solid .nav-t{opacity:1}
.nav-l{justify-self:start;display:flex}.nav-r{justify-self:end;display:flex;gap:2px}
.nb{background:none;border:0;color:var(--tint);font-size:17px;letter-spacing:-.41px;padding:8px;display:flex;align-items:center;gap:4px;cursor:pointer;min-height:44px;white-space:nowrap}
.nb:active{opacity:.35}.nb.b{font-weight:600}.nb:disabled{color:var(--label3);opacity:1}
.nb svg{width:22px;height:22px}
.ltrow{display:flex;align-items:flex-end;justify-content:space-between;padding-right:16px}
.lt{font-size:34px;line-height:41px;font-weight:700;letter-spacing:.37px;margin:0;padding:3px 16px 6px;text-wrap:balance}
.lsub{color:var(--label2);font-size:15px;letter-spacing:-.24px;padding:0 16px 4px;margin-top:-4px}
.avatar{width:36px;height:36px;border-radius:50%;border:0;background:linear-gradient(160deg,#9AA0AA,#6D727C);color:#fff;font-size:15px;font-weight:600;display:grid;place-items:center;cursor:pointer;margin-bottom:8px;flex:none}
.avatar:active{opacity:.6}

/* lists */
.sh{font-size:13px;line-height:18px;color:var(--label2);text-transform:uppercase;letter-spacing:-.08px;padding:24px 32px 7px;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.sh button{background:none;border:0;color:var(--tint);text-transform:none;font-size:15px;letter-spacing:-.24px;cursor:pointer;padding:0;white-space:nowrap}
.sf{font-size:13px;line-height:18px;letter-spacing:-.08px;color:var(--label2);padding:7px 32px 0}
.group{margin:0 16px;background:var(--card);border-radius:12px;overflow:hidden}
.row{display:flex;align-items:center;gap:12px;min-height:44px;padding-left:16px;position:relative;background:var(--card);width:100%;border:0;text-align:left;font-size:17px;letter-spacing:-.41px}
button.row,.row.tap{cursor:pointer}
button.row:active,.row.tap:active{background:var(--fill2)}
.row .body{flex:1;min-width:0;display:flex;align-items:center;gap:8px;padding:11px 16px 11px 0;align-self:stretch;position:relative}
.row:not(:last-child)>.body::after,.swipe:not(:last-child)>.row>.body::after{content:"";position:absolute;left:0;right:0;bottom:0;height:.5px;background:var(--sep)}
.row .tt{flex:1;min-width:0}
.row .t1{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .t2{font-size:15px;line-height:20px;color:var(--label2);letter-spacing:-.24px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .v{color:var(--label2);white-space:nowrap;text-align:right}
.row .amt{white-space:nowrap;text-align:right;font-variant-numeric:tabular-nums}
.row .amt small{display:block;font-size:13px;line-height:16px;color:var(--label2)}
.row input,.row select{flex:1;min-width:0;border:0;background:none;font:inherit;letter-spacing:inherit;color:var(--label);text-align:right;outline:none;padding:0}
.row input::placeholder{color:var(--label3)}
.row input.l{text-align:left}
.chev{width:8px;height:14px;color:var(--label3);flex:none;margin-left:2px}
.pos{color:var(--pos)} .neg{color:var(--red)}
.muted{color:var(--label2)}
.ico{--c:#8E8E93;width:30px;height:30px;border-radius:7px;display:grid;place-items:center;font-size:16px;line-height:1;flex:none;background:color-mix(in srgb,var(--c) 20%,transparent);color:var(--c);font-weight:700}
.ico.lg{width:40px;height:40px;border-radius:10px;font-size:20px}
.ico.solid{background:var(--c);color:#fff}
.ico.round{border-radius:50%}
.dot{width:10px;height:10px;border-radius:50%;flex:none;background:var(--c)}
.badge{min-width:22px;height:22px;padding:0 7px;border-radius:11px;background:var(--red);color:#fff;font-size:15px;font-weight:600;display:inline-grid;place-items:center;font-variant-numeric:tabular-nums}
.pill{font-size:12px;font-weight:600;padding:2px 8px;border-radius:10px;background:var(--fill);color:var(--label2);white-space:nowrap;letter-spacing:0;line-height:16px}
.pill.tint{background:color-mix(in srgb,var(--tint) 15%,transparent);color:var(--tint)}
.pill.warn{background:color-mix(in srgb,var(--orange) 18%,transparent);color:color-mix(in srgb,var(--orange) 65%,var(--label))}
.pill.ok{background:color-mix(in srgb,var(--pos) 15%,transparent);color:var(--pos)}

/* swipe to delete */
.swipe{position:relative;overflow:hidden}
.swipe .del{position:absolute;right:0;top:0;bottom:0;width:88px;background:var(--red);color:#fff;border:0;font-size:17px;cursor:pointer}
.swipe>.row{transition:transform .35s var(--ease);touch-action:pan-y}
.swipe>.row.drag{transition:none}

/* tab bar */
.tabbar{position:absolute;left:0;right:0;bottom:0;z-index:6;display:flex;padding-bottom:env(safe-area-inset-bottom);background:var(--bar);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);box-shadow:0 -.5px 0 var(--sep)}
.tab{flex:1;height:50px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;color:#8E8E93;font-size:10px;font-weight:500;letter-spacing:.1px;background:none;border:0;cursor:pointer;position:relative}
.tab.on{color:var(--tint)}
.tab svg{width:28px;height:25px}
.tab .badge{position:absolute;top:3px;left:calc(50% + 6px);min-width:18px;height:18px;font-size:13px;padding:0 5px;border-radius:9px}

/* controls */
.btn{display:flex;align-items:center;justify-content:center;gap:8px;height:50px;border-radius:14px;border:0;background:var(--tint);color:#fff;font-size:17px;font-weight:600;letter-spacing:-.41px;width:100%;cursor:pointer;transition:opacity .15s,transform .15s}
.btn:active{opacity:.75;transform:scale(.985)}
.btn.gray{background:var(--fill);color:var(--tint)}
.btn.plain{background:none;color:var(--tint);height:44px;font-weight:400}
.btn.sm{height:34px;width:auto;padding:0 14px;border-radius:17px;font-size:15px;letter-spacing:-.24px}
.btn:disabled{opacity:.4}
.btn svg{width:20px;height:20px}
.pad{padding:0 16px}
.stack{display:flex;flex-direction:column;gap:10px}
.seg{display:flex;background:var(--fill);border-radius:9px;padding:2px;position:relative;margin:0 16px}
.seg button{flex:1;position:relative;z-index:1;border:0;background:none;font-size:13px;font-weight:500;letter-spacing:-.08px;height:28px;color:var(--label);cursor:pointer}
.seg button.on{font-weight:600}
.seg .thumb{position:absolute;top:2px;bottom:2px;left:2px;border-radius:7px;background:var(--thumb);box-shadow:0 3px 8px rgba(0,0,0,.12),0 3px 1px rgba(0,0,0,.04);transition:transform .32s var(--ease)}
.search{margin:2px 16px 10px;display:flex;align-items:center;gap:6px;background:var(--fill);border-radius:10px;height:36px;padding:0 8px;color:var(--label2)}
.search svg{width:17px;height:17px;flex:none}
.search input{flex:1;border:0;background:none;font:inherit;color:var(--label);outline:none;min-width:0}
.search input::placeholder{color:var(--label2)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:0 16px 10px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;height:32px;padding:0 13px;border-radius:16px;background:var(--card);border:0;font-size:15px;letter-spacing:-.24px;cursor:pointer;display:flex;align-items:center;gap:6px;color:var(--label)}
.chip.on{background:var(--tint);color:#fff}
.monthbar{display:flex;align-items:center;justify-content:space-between;margin:0 8px 6px}
.monthbar .m{font-size:17px;font-weight:600;text-align:center}
.switch{position:relative;width:51px;height:31px;flex:none;border-radius:16px;background:var(--fill2);border:0;cursor:pointer;transition:background .25s}
.switch::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 3px 8px rgba(0,0,0,.15),0 1px 1px rgba(0,0,0,.16);transition:transform .3s var(--ease)}
.switch.on{background:#34C759}
.switch.on::after{transform:translateX(20px)}
.stepper{display:flex;background:var(--fill);border-radius:9px;overflow:hidden;flex:none}
.stepper button{width:46px;height:32px;border:0;background:none;font-size:22px;color:var(--label);cursor:pointer;line-height:1}
.stepper button+button{border-left:.5px solid var(--sep)}
.stepper button:active{background:var(--fill2)}
.stepper button:disabled{color:var(--label3)}
input[type=range]{width:100%;accent-color:var(--tint)}

/* cards */
.hero{margin:6px 16px 0;background:var(--card);border-radius:14px;padding:16px}
.hero .k{font-size:15px;color:var(--label2);letter-spacing:-.24px}
.hero .big{font-family:var(--round);font-size:40px;line-height:46px;font-weight:700;letter-spacing:.2px;margin:2px 0 4px;font-variant-numeric:tabular-nums}
.hero .meta{display:flex;gap:6px 16px;flex-wrap:wrap;font-size:15px;letter-spacing:-.24px;color:var(--label2)}
.hero .meta b{color:var(--label);font-weight:600}
.stackbar{display:flex;gap:2px;height:10px;border-radius:5px;overflow:hidden;margin:14px 0 10px;background:var(--fill)}
.stackbar i{display:block;height:100%;background:var(--c);min-width:3px}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;color:var(--label2);letter-spacing:-.08px}
.legend span{display:flex;align-items:center;gap:5px}
.legend .dot{width:8px;height:8px}
.notice{margin:10px 16px 0;border-radius:14px;padding:14px 16px;background:var(--card);display:flex;gap:12px;align-items:flex-start}
.notice .tt{flex:1;min-width:0}
.notice .t1{font-weight:600}
.notice .t2{font-size:15px;color:var(--label2);letter-spacing:-.24px;margin-top:2px;line-height:20px}
.notice .acts{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.notice.demo{background:color-mix(in srgb,var(--tint) 12%,var(--card))}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 16px 0}
.tile{background:var(--card);border-radius:14px;padding:12px 14px;border:0;text-align:left;font:inherit;color:inherit}
button.tile{cursor:pointer}
button.tile:active{background:var(--fill2)}
.tile .k{font-size:13px;color:var(--label2);letter-spacing:-.08px;display:flex;align-items:center;gap:5px}
.tile .v{font-family:var(--round);font-size:22px;line-height:28px;font-weight:700;margin-top:2px;font-variant-numeric:tabular-nums}
.tile .s{font-size:13px;color:var(--label2);line-height:17px}
.bar{height:6px;border-radius:3px;background:var(--fill);overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;border-radius:3px;background:var(--c);transition:width .6s var(--ease)}
.bar i.over{background:var(--red)}
.bar.thick{height:10px;border-radius:5px}
.empty{text-align:center;color:var(--label2);padding:36px 32px;font-size:15px;letter-spacing:-.24px;line-height:20px}
.empty b{display:block;color:var(--label);font-size:20px;font-weight:600;margin-bottom:6px;letter-spacing:.38px;line-height:25px}
.askbar{margin:10px 16px 0;display:flex;align-items:center;gap:10px;background:var(--card);border-radius:14px;padding:12px 14px;border:0;width:calc(100% - 32px);cursor:pointer;text-align:left;font:inherit;color:var(--label2)}
.askbar:active{background:var(--fill2)}

/* charts */
.chart{margin:0 16px;background:var(--card);border-radius:14px;padding:14px 14px 10px;position:relative}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart text{fill:var(--label2);font-size:11px;font-family:var(--font)}
.chart .grid{stroke:var(--sep);stroke-width:.5}
.tip{position:absolute;pointer-events:none;background:var(--card-s);box-shadow:0 6px 24px rgba(0,0,0,.18);border-radius:10px;padding:7px 10px;font-size:13px;line-height:17px;white-space:nowrap;z-index:3;opacity:0;transition:opacity .12s;letter-spacing:-.08px}
.tip.on{opacity:1}
.tip b{font-weight:600}
.donutwrap{display:flex;align-items:center;gap:16px}
.donutwrap svg{width:150px;flex:none}
.donut-c{font-family:var(--round)}

/* sheets */
.sheet-wrap{position:fixed;inset:0;z-index:20}
.sheet-bd{position:absolute;inset:0;background:rgba(0,0,0,.35);opacity:0;transition:opacity .45s}
.sheet-wrap.in .sheet-bd{opacity:1}
.sheet{--bg:var(--bg-s);--card:var(--card-s);position:absolute;left:0;right:0;bottom:0;top:calc(env(safe-area-inset-top) + 18px);max-width:720px;margin:0 auto;background:var(--bg);border-radius:12px 12px 0 0;transform:translateY(105%);transition:transform .5s var(--ease);display:flex;flex-direction:column;overflow:hidden;box-shadow:0 -2px 20px rgba(0,0,0,.12)}
.sheet.short{top:auto;max-height:88%}
.sheet-wrap.in .sheet{transform:none}
.sheet.drag{transition:none}
.grab{width:36px;height:5px;border-radius:3px;background:var(--label3);margin:6px auto 0;flex:none}
.sheet-nav{height:50px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:0 8px;flex:none;touch-action:none}
.sheet-nav .nav-t{opacity:1}
.sheet-body{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-bottom:calc(env(safe-area-inset-bottom) + 28px)}
.amount-in{display:flex;align-items:baseline;justify-content:center;gap:4px;padding:10px 16px 2px}
.amount-in input{font-family:var(--round);font-size:56px;line-height:64px;font-weight:700;border:0;background:none;color:var(--label);text-align:center;width:100%;outline:none;font-variant-numeric:tabular-nums;letter-spacing:.3px}
.amount-in input::placeholder{color:var(--label3)}
.cgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin:0 16px;background:var(--card);border-radius:12px;padding:10px 6px}
.cg{display:flex;flex-direction:column;align-items:center;gap:5px;padding:6px 2px;border-radius:10px;border:0;background:none;cursor:pointer;font-size:12px;line-height:14px;color:var(--label);letter-spacing:0;text-align:center;position:relative}
.cg .ico{width:44px;height:44px;border-radius:12px;font-size:22px;transition:transform .25s var(--ease),box-shadow .2s}
.cg.on .ico{box-shadow:0 0 0 2.5px var(--card),0 0 0 4.5px var(--c);transform:scale(1.04)}
.cg:active .ico{transform:scale(.92)}
.cg .sug{position:absolute;top:0;right:8px;width:9px;height:9px;border-radius:50%;background:var(--tint);box-shadow:0 0 0 2px var(--card)}
.drop{margin:0 16px;border:1.5px dashed var(--label3);border-radius:14px;padding:26px 16px;text-align:center;cursor:pointer;display:block;background:var(--card)}
.drop:active{background:var(--fill2)}
.drop .t1{font-weight:600;color:var(--tint);margin-top:8px}
.drop .t2{font-size:13px;color:var(--label2);margin-top:2px}
.spinner{width:28px;height:28px;margin:0 auto;border-radius:50%;border:3px solid var(--fill2);border-top-color:var(--label2);animation:spin .9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.qcard{margin:0 16px 12px;background:var(--card);border-radius:14px;padding:14px 16px;transition:transform .35s var(--ease),opacity .3s}
.qcard.out{transform:translateX(-110%);opacity:0}
.qcard .q{font-size:15px;color:var(--label2);letter-spacing:-.24px;line-height:20px;margin-top:8px}
.qcard .acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.qchip{height:34px;padding:0 12px;border-radius:17px;border:0;background:var(--fill);font-size:15px;letter-spacing:-.24px;cursor:pointer;display:flex;align-items:center;gap:6px;color:var(--label);white-space:nowrap}
.qchip:active{background:var(--fill2)}
.qchip.main{background:var(--tint);color:#fff}
.qchip.on{background:var(--tint);color:#fff}
.detail-h{text-align:center;padding:4px 16px 18px}
.detail-h .ico{margin:0 auto 10px;width:56px;height:56px;border-radius:14px;font-size:28px}

.composer button:disabled{background:var(--fill2)}
.typing{display:inline-flex;gap:4px;padding:4px 0}
.typing i{width:8px;height:8px;border-radius:50%;background:var(--label3);animation:blink 1.2s infinite}
.typing i:nth-child(2){animation-delay:.2s}.typing i:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,80%,100%{opacity:.3}40%{opacity:1}}

.as-wrap{position:fixed;inset:0;z-index:40}
.as-bd{position:absolute;inset:0;background:rgba(0,0,0,.35);opacity:0;transition:opacity .3s}

.as{position:absolute;left:8px;right:8px;bottom:calc(env(safe-area-inset-bottom) + 8px);max-width:560px;margin:0 auto;transform:translateY(120%);transition:transform .45s var(--ease);display:flex;flex-direction:column;gap:8px}
.as-wrap.in .as{transform:none}
.as-g{background:var(--bar);-webkit-backdrop-filter:blur(30px);backdrop-filter:blur(30px);border-radius:14px;overflow:hidden}
.as-g .msg{padding:14px 16px;text-align:center;font-size:13px;color:var(--label2);border-bottom:.5px solid var(--sep);line-height:18px}

.as-g.cancel{background:var(--card-s)}

.toast.on{transform:translate(-50%,0)}

.loading{position:absolute;inset:0;display:grid;place-items:center;background:var(--bg);z-index:35}

.scroll{padding-bottom:calc(env(safe-area-inset-bottom) + 112px)}

.nav,.nav.scrolled,.nav.solid{background:none;box-shadow:none;-webkit-backdrop-filter:none;backdrop-filter:none}

.sheet-nav .nb.b:disabled{color:#fff}
.nav-r{gap:8px}
.sheet-nav{height:64px;padding:0 14px}
.grab{display:none}

.tabbar{left:0;right:0;bottom:0;padding:0 14px calc(max(10px,env(safe-area-inset-bottom) - 8px));background:none;-webkit-backdrop-filter:none;backdrop-filter:none;box-shadow:none;align-items:center;gap:10px;pointer-events:none}

.tab{position:relative;z-index:1;height:56px;border-radius:28px;color:var(--label);font-size:10px;font-weight:600;gap:2px;min-width:0}
.tab span{white-space:nowrap}

.tab{transition:transform .2s var(--ease),color .2s}

.fab svg{width:26px;height:26px}
.fab:active{transform:scale(1.1)}

.group{border-radius:24px}
.hero,.tile,.chart,.notice,.qcard,.cgrid,.drop{border-radius:24px}

.btn{border-radius:25px;height:52px}

.composer textarea{border-radius:22px;background:var(--glass);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px)}
.composer button{width:38px;height:38px}
.avatar{box-shadow:inset 0 1px 1px rgba(255,255,255,.4),0 4px 12px rgba(0,0,0,.15)}
.loading{background:var(--bg)}
@media all and (display-mode: standalone){#app{bottom:auto;height:100vh}}
body.sheeted{background:#000}
.nav-in{height:46px}
.nav .nb,.sheet-nav .nb{height:40px;min-width:40px;border-radius:20px}
.nav .nb.ic,.sheet-nav .nb.ic{width:40px}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.01ms !important;transition-duration:.01ms !important}
}
@media (min-width:760px){
  .scroll>*{max-width:720px;margin-left:auto !important;margin-right:auto !important}
  .askbar{width:auto}
}

"use strict";
/* ================= helpers ================= */

  const cash = r2(accs.reduce((s, x) => s + (x.b ? x.b.v : 0), 0));
  const debt = r2(S.loans.reduce((s, l) => s + l.balance, 0));
  const owed = r2(S.people.reduce((s, p) => s + personBalance(p.id), 0));
  const net = r2(cash - debt + owed);
  const sav = savingsAccounts();
  let h = navHTML("Wealth", {right:`<button class="nb ic" data-a="newthing" aria-label="Add">${IC.plus}</button>`}) + `<div class="scroll"><h1 class="lt">Wealth</h1>`;
  h += `<div class="hero"><div class="k">What you own minus what you owe</div><div class="big ${net < 0 ? "neg" : ""}">${money(net)}</div><div class="meta"><span>Accounts <b class="num">${money0(cash)}</b></span><span>Loans <b class="num">−${money0(debt)}</b></span>${owed ? `<span>Friends <b class="num">${owed > 0 ? "+" : "−"}${money0(Math.abs(owed))}</b></span>` : ""}</div></div>`;
  // savings chart
  const months = Array.from({length:12}, (_, i) => addMonths(ymOf(todayISO()), i - 11));
  const pts = sav.length ? months.map(k => ({k, v:sav.reduce((s, a) => s + (balanceAt(a, k) || 0), 0)})).filter((p, i, arr) => arr.slice(0, i + 1).some(q => q.v > 0)) : [];
  if (pts.length > 1) {
    const last = pts[pts.length - 1].v, prev = pts[pts.length - 2].v, first = pts[0].v;
    h += `<div class="sh"><span>Savings</span></div><div class="chart"><div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px"><div><div class="muted" style="font-size:13px">Total in savings</div><div style="font-family:var(--round);font-size:22px;font-weight:700">${money(last)}</div></div><div style="text-align:right;font-size:13px"><div class="${last - prev >= 0 ? "pos" : "neg"}" style="font-weight:600">${last - prev >= 0 ? "+" : "−"}${money(Math.abs(last - prev))} this month</div><div class="muted">${last - first >= 0 ? "+" : "−"}${money0(Math.abs(last - first))} since ${esc(monthShort(pts[0].k))}</div></div></div>${lineSVG(pts, {color:pc(0), label:"Savings"})}<div class="tip"></div></div>`;
  } else if (!sav.length) h += `<div class="notice">${IC.spark}<div class="tt"><div class="t1">Track your savings</div><div class="t2">Add your savings account, then upload its statements. Pocket charts the balance and how much you put aside each month.</div><div class="acts"><button class="btn sm" data-a="newacc" data-type="savings">Add savings account</button></div></div></div>`;
  for (const a of sav) { const mv = savingsMoves(a); if (!mv.moves.length) continue;
    h += `<div class="sh"><span>In and out of ${esc(a)}</span></div><div class="group"><button class="row" data-a="page" data-id="savemoves" data-x="${esc(a)}"><span class="ico" style="--c:${pc(0)}">⇅</span><div class="body"><div class="tt"><div class="t1">${mv.net >= 0 ? "Put aside" : "Taken out"} ${money0(Math.abs(mv.net))} overall</div><div class="t2">${mv.openLeft > .009 ? money0(mv.openLeft) + " taken out, not put back yet" : mv.took ? "Everything you took out was put back" : "Only deposits so far"}</div></div>${IC.chev}</div></button></div>`; }
  h += `<div class="sh"><span>Accounts</span><button data-a="newacc">Add</button></div><div class="group">${accs.map(x => `<button class="row" data-a="acct" data-id="${esc(x.a)}"><span class="ico" style="--c:${x.type === "savings" ? pc(0) : x.type === "cash" ? catCol(null) : pc(1)}">${x.type === "savings" ? "🐷" : x.type === "cash" ? "💵" : "🏦"}</span><div class="body"><div class="tt"><div class="t1">${esc(x.a)}</div><div class="t2">${x.type === "savings" ? "Savings" : x.type === "cash" ? "Cash" : (S.acctRole || {})[x.a] === "home" ? "Pays the home costs" : "Current account"}${x.b ? " · " + esc(monthShort(x.b.k)) : " · tap to set balance"}</div></div><span class="amt">${x.b ? money(x.b.v) : "–"}</span>${IC.chev}</div></button>`).join("")}</div><div class="sf">Balances update by themselves from the "new balance" line of each statement you upload.</div>`;
  // goals
  h += `<div class="sh"><span>Goals</span><button data-a="newgoal">Add</button></div>`;
  if (S.goals.length) h += `<div class="group">${S.goals.map(g => { const s = goalSaved(g), p = g.target ? Math.min(1, s / g.target) : 0, mLeft = g.date ? Math.max(1, (parseISO(g.date).getFullYear() - new Date().getFullYear()) * 12 + parseISO(g.date).getMonth() - new Date().getMonth()) : null; return `<button class="row" data-a="goal" data-id="${g.id}"><span class="ico lg" style="--c:${pc(2)}">${esc(g.emoji || "🎯")}</span><div class="body"><div class="tt"><div class="t1">${esc(g.name)}</div><div class="bar"><i style="--c:${p >= 1 ? catCol(catById("income")) : pc(2)};width:${p * 100}%"></i></div><div class="t2" style="margin-top:3px">${money0(s)} of ${money0(g.target)}${mLeft && s < g.target ? ` · ${money0((g.target - s) / mLeft)}/month to make it` : p >= 1 ? " · reached 🎉" : ""}</div></div>${IC.chev}</div></button>`; }).join("")}</div>`;
  else h += `<div class="group"><button class="row" data-a="newgoal"><span class="ico" style="--c:${pc(2)}">🎯</span><div class="body"><div class="tt"><div class="t1" style="color:var(--tint)">Add a savings goal</div><div class="t2">Holiday, new phone, emergency fund…</div></div></div></button></div>`;
  // loans
  h += `<div class="sh"><span>Loans & advances</span><button data-a="newloan">Add</button></div>`;
  if (S.loans.length) h += `<div class="group">${S.loans.map(l => { const n = monthsLeft(l.balance, l.monthly, l.rate), p = loanPaid(l); return `<button class="row" data-a="page" data-id="loan" data-x="${l.id}"><span class="ico lg" style="--c:${catCol(catById("loan"))}">${esc(l.emoji || "🚗")}</span><div class="body"><div class="tt"><div class="t1">${esc(l.name)}</div><div class="bar"><i style="--c:${catCol(catById("loan"))};width:${p * 100}%"></i></div><div class="t2" style="margin-top:3px">${Math.round(p * 100)}% paid · ${l.balance <= 0 ? "paid off 🎉" : isFinite(n) ? n + " months left" : "add a monthly payment"}</div></div><span class="amt">${money0(l.balance)}</span>${IC.chev}</div></button>`; }).join("")}</div>`;
  else h += `<div class="group"><button class="row" data-a="newloan"><span class="ico" style="--c:${catCol(catById("loan"))}">🚗</span><div class="body"><div class="tt"><div class="t1" style="color:var(--tint)">Add a loan or advance</div><div class="t2">Car loan, salary advance, money borrowed…</div></div></div></button></div>`;
  // payslips
  const slips = S.payslips.slice().sort((a, b) => b.period.localeCompare(a.period));
  h += `<div class="sh"><span>Income</span></div><div class="group"><button class="row" data-a="page" data-id="payslips"><span class="ico" style="--c:${catCol(catById("income"))}">💶</span><div class="body"><div class="tt"><div class="t1">Payslips</div><div class="t2">${slips.length ? "Last: " + esc(monthLong(slips[0].period)) + " · " + money(slips[0].net) + " net" : "Upload your monthly payslip"}</div></div><span class="v">${slips.length || ""}</span>${IC.chev}</div></button></div>`;
  return h + `</div>`;
}

/* ================= People ================= */
function renderPeople() {
  const ps = S.people.map(p => ({p, b:personBalance(p.id)})).sort((a, b) => Math.abs(b.b) - Math.abs(a.b) || (b.p.uses || 0) - (a.p.uses || 0));
  const toMe = r2(ps.reduce((s, x) => s + Math.max(0, x.b), 0)), fromMe = r2(ps.reduce((s, x) => s + Math.max(0, -x.b), 0));
  const splits = allTx().filter(t => t.split).sort((a, b) => b.date.localeCompare(a.date)).slice(0, 6);
  let h = navHTML("People", {right:`<button class="nb ic" data-a="newiou" aria-label="Add who owes what">${IC.plus}</button>`}) + `<div class="scroll"><h1 class="lt">People</h1>`;
  h += `<div class="tiles" style="margin-top:4px"><div class="tile"><div class="k">Owed to you</div><div class="v ${toMe ? "pos" : ""}">${money(toMe)}</div></div><div class="tile"><div class="k">You owe</div><div class="v ${fromMe ? "neg" : ""}">${money(fromMe)}</div></div></div>`;
  h += `<div class="qa" style="margin-top:10px"><button data-a="splitpick">${IC.split}Split a bill</button><button data-a="newiou">${IC.plus}Add IOU</button><button data-a="newperson">${IC.done}Add person</button></div>`;
  if (!ps.length) h += `<div class="empty"><b>Share costs with friends</b>Split any purchase between 2 to 8 people. Pocket tracks who still owes you and spots their bank transfer when they pay you back.</div>`;
  else {
    const open = ps.filter(x => Math.abs(x.b) > .009), clear = ps.filter(x => Math.abs(x.b) <= .009);
    if (open.length) h += `<div class="sh"><span>Open</span></div><div class="group">${open.map(x => personRow(x)).join("")}</div>`;
    if (clear.length) h += `<div class="sh"><span>All settled</span></div><div class="group">${clear.map(x => personRow(x)).join("")}</div>`;
  }
  if (splits.length) h += `<div class="sh"><span>Recent splits</span></div><div class="group">${splits.map(t => txRow(t, {swipe:false, showDate:true})).join("")}</div>`;
  return h + `</div>`;
}
function personRow({p, b}) {
  return `<button class="row" data-a="page" data-id="person" data-x="${p.id}">${personIco(p)}<div class="body"><div class="tt"><div class="t1">${esc(p.name)}</div><div class="t2">${b > .009 ? "Owes you" : b < -.009 ? "You owe" : "Settled up"}</div></div><span class="amt ${b > .009 ? "pos" : b < -.009 ? "neg" : "muted"}">${Math.abs(b) > .009 ? money(Math.abs(b)) : ""}</span>${IC.chev}</div></button>`;
}

}

/* ================= sheets ================= */
const sheets = [];
function openSheet(build, {short = false, onClose} = {}) {
  const wrap = document.createElement("div");
  wrap.className = "sheet-wrap";
  wrap.innerHTML = `<div class="sheet-bd"></div><div class="sheet ${short ? "short" : ""}" role="dialog" aria-modal="true"><div class="grab"></div><div class="sheet-in" style="display:flex;flex-direction:column;flex:1;min-height:0"></div></div>`;
  $("#layer").appendChild(wrap);
  const sh = {wrap, el:$(".sheet-in", wrap), build, onClose, rerender(keep = true) { const b = $(".sheet-body", this.el), st = b ? b.scrollTop : 0; this.el.innerHTML = this.build(this); const nb = $(".sheet-body", this.el); if (nb && keep) nb.scrollTop = st; afterRender(this.el); this.after && this.after(this); }};
  sheets.push(sh); sh.rerender(false);
  $(".sheet-bd", wrap).addEventListener("click", () => closeSheet(sh));
  bindSheetDrag(sh);
  if (sheets.length === 1) { $("#app").classList.add("behind"); document.body.classList.add("sheeted"); }
  requestAnimationFrame(() => requestAnimationFrame(() => wrap.classList.add("in")));
  return sh;
}
function closeSheet(sh = sheets[sheets.length - 1]) {
  if (!sh) return;
  const i = sheets.indexOf(sh); if (i >= 0) sheets.splice(i, 1);
  sh.wrap.classList.remove("in"); $(".sheet", sh.wrap).style.transform = "";
  if (!sheets.length) { $("#app").classList.remove("behind"); setTimeout(() => { if (!sheets.length) document.body.classList.remove("sheeted"); }, 480); }
  setTimeout(() => sh.wrap.remove(), 480);
  sh.onClose && sh.onClose();
}
function bindSheetDrag(sh) {
  const s = $(".sheet", sh.wrap); let y0 = null, dy = 0;
  s.addEventListener("pointerdown", e => { if (!e.target.closest(".grab, .sheet-nav") || e.target.closest("button")) return; y0 = e.clientY; dy = 0; s.classList.add("drag"); s.setPointerCapture(e.pointerId); });
  s.addEventListener("pointermove", e => { if (y0 === null) return; dy = Math.max(0, e.clientY - y0); s.style.transform = `translateY(${dy}px)`; });
  const end = () => { if (y0 === null) return; y0 = null; s.classList.remove("drag"); if (dy > 110) closeSheet(sh); else s.style.transform = ""; };
  s.addEventListener("pointerup", end); s.addEventListener("pointercancel", end);
}
const sheetNav = (title, left, right) => `<div class="sheet-nav"><div class="nav-l">${left || ""}</div><div class="nav-t">${esc(title)}</div><div class="nav-r">${right || ""}</div></div>`;

/* --- split the bill --- */
function splitSummary(sp, total) {
  const n = sp.people.length + (sp.me ? 1 : 0); if (!total || !n) return "";
  const s = buildSplit(sp, total), back = r2(total - s.mine);
  return sp.mode === "equal" ? `${n} people · ${money(total / n)} each · you get back ${money(back)}` : `Custom split · you pay ${money(s.mine)} · you get back ${money(back)}`;
}
function buildSplit(sp, total) {
  const n = sp.people.length + (sp.me ? 1 : 0);
  let shares;
  if (sp.mode === "equal") {
    const each = Math.floor(total / n * 100) / 100;
    shares = sp.people.map(x => ({name:x.name, amount:each}));
  } else shares = sp.people.map(x => ({name:x.name, amount:r2(num(x.amount))}));
  const others = r2(shares.reduce((s, x) => s + x.amount, 0));
  const mine = sp.me ? r2(total - others) : 0;
  if (!sp.me && Math.abs(others - total) > .009 && shares.length) shares[shares.length - 1].amount = r2(shares[shares.length - 1].amount + total - others);
  return {mode:sp.mode, mine:Math.max(0, mine), shares:shares.map(x => ({pid:(ensurePerson(x.name || "Friend") || {}).id, amount:x.amount, paid:false}))};
}

    const n = sp.people.length + (sp.me ? 1 : 0), s = n ? buildSplitPreview(sp, total) : null;

async function runImport(sh, files) {

      st.phase = "slip"; sh.rerender(false); return;
    }

    for (const [fi, f] of files.entries()) {
      const pdf = await readPdf(f, (i, n) => step(files.length > 1 ? `File ${fi + 1} of ${files.length}: page ${i} of ${n}…` : `Reading page ${i} of ${n}…`));
      const text = pdf.pages.join("\n"), meta = statementMeta(text);
      let fileRows = heuristicParse(text, new Date().getFullYear()), ok = false;
      // the built-in reader is trusted when its lines add up exactly to the statement's balances
      if (meta.opening != null && meta.closing != null && fileRows.length) ok = Math.abs(meta.opening + fileRows.reduce((s, r) => s + r.amount, 0) - meta.closing) < .02;
      if (!ok) { const ai = await aiStatement(pdf, st.bank, step); if (ai && ai.rows.length) { fileRows = ai.rows; meta.period ||= ai.period; if (meta.closing == null) meta.closing = ai.closing; meta.holder ||= ai.holder; if (meta.opening != null && meta.closing != null) ok = Math.abs(meta.opening + fileRows.reduce((s, r) => s + Number(r.amount || 0), 0) - meta.closing) < .02; } else st.ai = false; }
      rows = rows.concat(fileRows); reconciled = reconciled && ok;
      if (!period || (meta.period && meta.period > period)) { period = meta.period || period; closing = meta.closing; }
      opening ??= meta.opening; holder ||= meta.holder; st.ownIban ||= meta.ownIban;
      if (files.length > 1 && meta.period && meta.closing != null) (S.balances[st.bank] ||= {})[meta.period] = meta.closing;
    }
    if (holder && !S.settings.holder) S.settings.holder = holder.replace(/\s+/g, " ").trim();
    step("Checking against what you added…"); await sleep(200);
    Object.assign(st, {prep:prepareStatement(rows, st.bank), period:files.length > 1 ? null : period, closing, holder, reconciled, phase:"review"});
    sh.rerender(false);
  } catch (e) {
    st.phase = "pick"; sh.rerender(false);
    toast(e && e.message === "load" ? "Couldn't load the PDF reader. Check your connection." : "Couldn't read that PDF. Is it a statement exported from your bank?");
  }
}

/* ================= swipe to delete ================= */
function bindSwipes(root) {
  $$(".swipe", root).forEach(sw => {
    const row = sw.querySelector(":scope > .row"); let x0 = null, y0 = 0, dx = 0, locked = null, open = false;
    row.addEventListener("pointerdown", e => { if (e.pointerType === "mouse" && e.button !== 0) return; x0 = e.clientX; y0 = e.clientY; dx = 0; locked = null; });
    row.addEventListener("pointermove", e => {
      if (x0 === null) return;
      const mx = e.clientX - x0, my = e.clientY - y0;
      if (locked === null && (Math.abs(mx) > 8 || Math.abs(my) > 8)) locked = Math.abs(mx) > Math.abs(my) ? "x" : "y";
      if (locked !== "x") return;
      row.classList.add("drag"); dx = Math.min(0, mx + (open ? -88 : 0)); row.style.transform = `translateX(${Math.max(-140, dx)}px)`;
    });
    const end = () => { if (x0 === null) return; x0 = null; row.classList.remove("drag"); if (locked === "x") { open = dx < -44; row.style.transform = open ? "translateX(-88px)" : ""; row.dataset.swiped = "1"; setTimeout(() => delete row.dataset.swiped, 60); } };
    row.addEventListener("pointerup", end); row.addEventListener("pointercancel", end);
  });
}

async function backup() {

    else { const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 4000); }

  } catch (e) { if (e && e.name !== "AbortError") toast("Couldn't create the backup."); }
}
